specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MiniAMM
    network: mainnet
    source:
      abi: MiniAMM
      address: "0x67ccb9C8CCE8C7CdD1A280F40f85B329B0A56C04" # Replace with your deployed contract address
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
      abis:
        - name: MiniAMM
          file: ./abis/MiniAMM.json
      eventHandlers:
        - event: Swap(uint256,uint256)  # Updated event signature
          handler: handleSwap
      file: ./src/mapping.ts